name: Release

# Pushed by scripts/release.sh: a v<version> tag builds, tests and publishes a GitHub Release with
# the jar attached and that version's CHANGELOG.md section as the release notes.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag, mod version and changelog agree
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^mod_version=$VERSION\$" gradle.properties || { echo "mod_version is not $VERSION"; exit 1; }
          python3 scripts/changelog_section.py "$VERSION" > release-notes.md
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build and unit tests
        run: ./gradlew build --console=plain

      - name: Game tests (dedicated test server)
        run: ./gradlew runGameTestServer --console=plain

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="build/libs/chunkexpress-$VERSION.jar"
          test -f "$JAR" || { echo "missing $JAR"; ls build/libs; exit 1; }
          PRERELEASE=""
          case "$VERSION" in 0.*|*-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$JAR" --title "Chunk Express $VERSION" \
              --notes-file release-notes.md $PRERELEASE
